<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 500" width="630" height="500">
  <defs>
    <!-- Dark Slate & Cyberpunk Navy Background -->
    <radialGradient id="itchBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1B263B" />
      <stop offset="55%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanHouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Crimson Stamp Gradient -->
    <linearGradient id="crimsonStamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A46" />
      <stop offset="100%" stop-color="#C20023" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="630" height="500" fill="url(#itchBg)" />

  <!-- Grid Blueprint Pattern -->
  <g stroke="#1E293B" stroke-width="1" stroke-opacity="0.35">
    <line x1="0" y1="125" x2="630" y2="125" />
    <line x1="0" y1="250" x2="630" y2="250" />
    <line x1="0" y1="375" x2="630" y2="375" />
    <line x1="157" y1="0" x2="157" y2="500" />
    <line x1="315" y1="0" x2="315" y2="500" />
    <line x1="472" y1="0" x2="472" y2="500" />
  </g>

  <!-- Ambient Glows -->
  <circle cx="315" cy="220" r="220" fill="#38BDF8" fill-opacity="0.07" filter="blur(50px)" />
  <circle cx="315" cy="380" r="180" fill="#FF1A46" fill-opacity="0.06" filter="blur(50px)" />

  <!-- TOP HEADER / CATEGORY BADGE -->
  <g transform="translate(315, 48)">
    <rect x="-135" y="0" width="270" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="0" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="2">
      CORPORATE SURVIVAL SIM
    </text>
  </g>

  <!-- GAME TITLE LOCKUP -->
  <g transform="translate(315, 120)">
    <text x="0" y="0" font-family="'Franklin Gothic Heavy', 'Impact', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      DEAR HIRING
    </text>
    <text x="0" y="44" font-family="'Franklin Gothic Heavy', 'Impact', sans-serif" font-size="44" font-weight="900" fill="url(#cyanHouse)" text-anchor="middle" letter-spacing="1">
      MANAGER
    </text>
  </g>

  <!-- CENTRAL DOSSIER & STAMP (THE HERO MARK) -->
  <g transform="translate(190, 185)" filter="url(#cardShadow)">
    <!-- Document Page (250px wide x 250px tall) -->
    <path d="M 0 14 C 0 6.2 6.2 0 14 0 L 180 0 L 250 70 L 250 236 C 250 243.8 243.8 250 236 250 L 14 250 C 6.2 250 0 243.8 0 236 Z" fill="url(#paperGrad)" />
    <path d="M 180 0 L 250 70 L 194 70 C 186.2 70 180 63.8 180 56 Z" fill="#CBD5E1" />

    <!-- Avatar silhouette -->
    <rect x="22" y="24" width="40" height="40" rx="10" fill="#1E293B" />
    <circle cx="42" cy="38" r="9" fill="#FFFFFF" />
    <path d="M 31 58 C 31 49 37 47 42 47 C 47 47 53 49 53 58 Z" fill="#FFFFFF" />
    
    <!-- Header lines -->
    <rect x="74" y="28" width="70" height="12" rx="6" fill="#0A1128" />
    <rect x="74" y="46" width="46" height="8" rx="4" fill="#64748B" />

    <!-- Text lines -->
    <rect x="22" y="80" width="206" height="11" rx="5" fill="#94A3B8" />
    <rect x="22" y="98" width="180" height="11" rx="5" fill="#94A3B8" />
    <rect x="22" y="116" width="195" height="11" rx="5" fill="#94A3B8" />

    <!-- 5 Star Rating -->
    <g transform="translate(22, 140)">
      <polygon points="8,1 10,6 16,6 11,10 13,15 8,12 3,15 5,10 0,6 6,6" fill="#FBBF24" />
      <polygon points="26,1 28,6 34,6 29,10 31,15 26,12 21,15 23,10 18,6 24,6" fill="#FBBF24" />
      <polygon points="44,1 46,6 52,6 47,10 49,15 44,12 39,15 41,10 36,6 42,6" fill="#FBBF24" />
      <polygon points="62,1 64,6 70,6 65,10 67,15 62,12 57,15 59,10 54,6 60,6" fill="#FBBF24" />
      <polygon points="80,1 82,6 88,6 83,10 85,15 80,12 75,15 77,10 72,6 78,6" fill="#CBD5E1" />
    </g>

    <!-- Signature -->
    <path d="M 22 185 Q 45 165 70 185 T 120 180" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />

    <!-- HIRED! STAMP (SLANTED ACROSS BOTTOM) -->
    <g transform="translate(125, 175) rotate(-11)" filter="url(#stampShadow)">
      <rect x="-135" y="-42" width="270" height="84" rx="16" fill="url(#crimsonStamp)" stroke="#FFFFFF" stroke-width="6" />
      <rect x="-127" y="-34" width="254" height="68" rx="10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="230, 8, 8, 8" stroke-opacity="0.95" />
      <text x="0" y="22" font-family="'Franklin Gothic Heavy', 'Impact', sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
        HIRED!
      </text>
    </g>
  </g>

  <!-- BOTTOM STRAPLINE -->
  <text x="315" y="475" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    CAN YOU BEAT THE CORPORATE LADDER?
  </text>
</svg>
