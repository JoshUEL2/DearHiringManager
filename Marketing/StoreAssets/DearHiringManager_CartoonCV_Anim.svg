<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @keyframes cvIn {
        0% { transform: translate(400px, 400px) scale(0.2) rotate(-14deg) translateY(200px); opacity: 0; }
        20% { transform: translate(400px, 400px) scale(1.05) rotate(2deg) translateY(0); opacity: 1; }
        25% { transform: translate(400px, 400px) scale(0.98) rotate(-1deg) translateY(0); opacity: 1; }
        30%, 75% { transform: translate(400px, 400px) scale(1) rotate(0deg) translateY(0); opacity: 1; }
        85% { transform: translate(400px, 400px) scale(1.02) rotate(-2deg) translateY(0); opacity: 1; }
        95%, 100% { transform: translate(400px, 400px) scale(0.8) rotate(18deg) translateY(-900px); opacity: 0; }
      }
      @keyframes stampSlam {
        0%, 36% { transform: scale(3.5) rotate(-28deg); opacity: 0; }
        42% { transform: scale(0.92) rotate(-13deg); opacity: 1; }
        47% { transform: scale(1.04) rotate(-13deg); opacity: 1; }
        52%, 100% { transform: scale(1) rotate(-13deg); opacity: 1; }
      }
      @keyframes lineDraw {
        0%, 25% { transform: scaleX(0); }
        35%, 100% { transform: scaleX(1); }
      }
      @keyframes starPop {
        0%, 30% { transform: scale(0) rotate(-90deg); opacity: 0; }
        36% { transform: scale(1.3) rotate(10deg); opacity: 1; }
        40%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes impactBurst {
        0%, 41% { transform: scale(0.2); opacity: 0; }
        43% { transform: scale(1.2); opacity: 1; }
        48%, 100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes gridPulse {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.22; }
      }
      .cv-container {
        animation: cvIn 4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 0 0;
      }
      .stamp-group {
        animation: stampSlam 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        transform-origin: 0 0;
      }
      .impact-lines {
        animation: impactBurst 4s ease-out infinite;
        transform-origin: 0 0;
      }
      .line-1 { animation: lineDraw 4s ease-out infinite; transform-origin: left; }
      .star-1 { animation: starPop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; transform-origin: 15px 15px; }
      .bg-grid { animation: gridPulse 4s ease-in-out infinite; }
    </style>

    <!-- Grid Pattern -->
    <pattern id="cyanGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>

    <!-- Stamp Shadow -->
    <filter id="hardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="stampShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Deep Blue Cyberpunk Slate Backdrop -->
  <rect width="100%" height="100%" fill="#070d1f" />
  <rect width="100%" height="100%" fill="url(#cyanGrid)" class="bg-grid" />
  <circle cx="400" cy="380" r="320" fill="radial-gradient(circle, #1e3a8a 0%, transparent 70%)" opacity="0.35" />

  <!-- Cartoon CV Root Group -->
  <g class="cv-container">
    <!-- Main Paper Shadow & Body -->
    <g transform="translate(-190, -250)" filter="url(#hardShadow)">
      <!-- Main CV Paper -->
      <path d="M 0 32 
               C 0 14, 14 0, 32 0 
               L 280 0 
               L 380 100 
               L 380 488 
               C 380 506, 366 520, 348 520 
               L 32 520 
               C 14 520, 0 506, 0 488 Z" 
            fill="#f8fafc" stroke="#0b1226" stroke-width="8" stroke-linejoin="round" />

      <!-- Folded Dog-Ear Corner -->
      <path d="M 280 0 L 280 92 C 280 97, 283 100, 288 100 L 380 100 Z" 
            fill="#cbd5e1" stroke="#0b1226" stroke-width="8" stroke-linejoin="round" />

      <!-- Candidate Avatar Badge -->
      <rect x="36" y="36" width="90" height="90" rx="20" fill="#1e293b" stroke="#0b1226" stroke-width="6"/>
      <!-- Avatar Silhouette -->
      <g fill="#f8fafc">
        <circle cx="81" cy="68" r="18"/>
        <path d="M 52 118 C 52 96, 64 90, 81 90 C 98 90, 110 96, 110 118 Z"/>
      </g>

      <!-- Candidate Header Bars -->
      <rect x="146" y="46" width="180" height="22" rx="11" fill="#0b1226"/>
      <rect x="146" y="80" width="120" height="16" rx="8" fill="#64748b"/>

      <!-- CV Section Lines (Simulated Experience) -->
      <g fill="#94a3b8">
        <rect x="36" y="160" width="308" height="18" rx="9" class="line-1"/>
        <rect x="36" y="196" width="260" height="18" rx="9" class="line-1"/>
        <rect x="36" y="232" width="290" height="18" rx="9" class="line-1"/>
        <rect x="36" y="268" width="210" height="18" rx="9" class="line-1"/>
      </g>

      <!-- Review Star Ratings (4 Gold, 1 Silver) -->
      <g transform="translate(36, 316)">
        <g class="star-1" transform="translate(0, 0)">
          <polygon points="16,2 20,12 30,13 22,20 25,30 16,24 7,30 10,20 2,13 12,12" fill="#fbbf24" stroke="#0b1226" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="star-1" transform="translate(38, 0)">
          <polygon points="16,2 20,12 30,13 22,20 25,30 16,24 7,30 10,20 2,13 12,12" fill="#fbbf24" stroke="#0b1226" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="star-1" transform="translate(76, 0)">
          <polygon points="16,2 20,12 30,13 22,20 25,30 16,24 7,30 10,20 2,13 12,12" fill="#fbbf24" stroke="#0b1226" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="star-1" transform="translate(114, 0)">
          <polygon points="16,2 20,12 30,13 22,20 25,30 16,24 7,30 10,20 2,13 12,12" fill="#fbbf24" stroke="#0b1226" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="star-1" transform="translate(152, 0)">
          <polygon points="16,2 20,12 30,13 22,20 25,30 16,24 7,30 10,20 2,13 12,12" fill="#cbd5e1" stroke="#0b1226" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <!-- Impact Lines on Stamp Landing -->
    <g transform="translate(0, 110)" class="impact-lines" stroke="#0b1226" stroke-width="6" stroke-linecap="round">
      <line x1="-180" y1="-70" x2="-220" y2="-90"/>
      <line x1="180" y1="-70" x2="220" y2="-90"/>
      <line x1="-190" y1="50" x2="-230" y2="70"/>
      <line x1="190" y1="50" x2="230" y2="70"/>
      <line x1="0" y1="120" x2="0" y2="160"/>
      <line x1="0" y1="-130" x2="0" y2="-170"/>
    </g>

    <!-- Bold Red HIRED! Stamp -->
    <g transform="translate(0, 110)">
      <g class="stamp-group">
        <g transform="translate(-175, -55)" filter="url(#stampShadow)">
          <!-- Outer Stamp Border -->
          <rect x="0" y="0" width="350" height="110" rx="18" fill="#e11d48" stroke="#ffffff" stroke-width="8"/>
          <!-- Inner Stamped Ridge -->
          <rect x="10" y="10" width="330" height="90" rx="12" fill="none" stroke="#be123c" stroke-width="5"/>
          <!-- HIRED! Typographic Mark -->
          <text x="175" y="78" 
                text-anchor="middle" 
                font-family="Impact, 'Arial Black', sans-serif" 
                font-size="68" 
                font-weight="900" 
                letter-spacing="4" 
                fill="#ffffff" 
                stroke="#881337" 
                stroke-width="3">
            HIRED!
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
