<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlowV5" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#242E46" />
      <stop offset="65%" stop-color="#121622" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGradV5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E7F2" />
    </linearGradient>

    <!-- Deep Red Stamp Gradient -->
    <linearGradient id="stampGradV5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A46" />
      <stop offset="100%" stop-color="#C20023" />
    </linearGradient>

    <!-- Document Shadow -->
    <filter id="docShadowV5" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Stamp High-Contrast 3D Drop Shadow -->
    <filter id="stampShadowV5" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- 1. Squircle Base (512x512) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGlowV5)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#3D4B6E" stroke-width="3" stroke-opacity="0.5" />

  <!-- 2. Application Document -->
  <g transform="translate(92, 42)" filter="url(#docShadowV5)">
    <path d="M 0 22 C 0 9.85 9.85 0 22 0 L 230 0 L 328 98 L 328 388 C 328 400.15 318.15 410 306 410 L 22 410 C 9.85 410 0 400.15 0 388 Z" fill="url(#paperGradV5)" />
    <path d="M 230 0 L 328 98 L 250 98 C 238.95 98 230 89.05 230 78 Z" fill="#BAC3D9" />
    <path d="M 230 0 L 230 78 C 230 89.05 238.95 98 250 98 L 328 98" fill="none" stroke="#909CBF" stroke-width="3" />

    <!-- Photo Silhouette -->
    <rect x="36" y="38" width="64" height="64" rx="16" fill="#2E3850" />
    <circle cx="68" cy="60" r="16" fill="#FFFFFF" />
    <path d="M 48 92 C 48 78 57 76 68 76 C 79 76 88 78 88 92 Z" fill="#FFFFFF" />

    <!-- Application Heading Lines -->
    <rect x="116" y="46" width="115" height="20" rx="10" fill="#182032" />
    <rect x="116" y="74" width="75" height="14" rx="7" fill="#66738F" />

    <!-- Dossier Content Lines -->
    <rect x="36" y="126" width="256" height="18" rx="9" fill="#B4BED2" />
    <rect x="36" y="158" width="224" height="18" rx="9" fill="#B4BED2" />
    <rect x="36" y="190" width="244" height="18" rx="9" fill="#B4BED2" />

    <!-- 5 Star Candidate Rating -->
    <g transform="translate(36, 230)">
      <polygon points="15,2 19,11 29,11 21,17 24,26 15,20 6,26 9,17 1,11 11,11" fill="#FFB703" />
      <polygon points="47,2 51,11 61,11 53,17 56,26 47,20 38,26 41,17 33,11 43,11" fill="#FFB703" />
      <polygon points="79,2 83,11 93,11 85,17 88,26 79,20 70,26 73,17 65,11 75,11" fill="#FFB703" />
      <polygon points="111,2 115,11 125,11 117,17 120,26 111,20 102,26 105,17 97,11 107,11" fill="#FFB703" />
      <polygon points="143,2 147,11 157,11 149,17 152,26 143,20 134,26 137,17 129,11 139,11" fill="#C5CEE0" />
    </g>
  </g>

  <!-- 3. V5 STAMP: AUTHENTIC IMPACT FONT WITH RED STROKE SEPARATION & LETTER SPACING -->
  <!-- Angled -10deg -->
  <g transform="translate(256, 368) rotate(-10)" filter="url(#stampShadowV5)">
    <!-- Badge Background Plate -->
    <rect x="-215" y="-68" width="430" height="136" rx="24" fill="url(#stampGradV5)" stroke="#FFFFFF" stroke-width="9" />

    <!-- Distressed Inner Border Frame -->
    <rect x="-202" y="-55" width="404" height="110" rx="16" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-dasharray="370, 10, 10, 10" stroke-opacity="0.95" />

    <!-- TRUE IMPACT TEXT WITH DARK RED SEPARATION STROKE -->
    <!-- The stroke carves out spacing around the letters and inside narrow counters, keeping Impact's iconic punch without blurring together -->
    <text x="0" y="32" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="96" 
          font-weight="900" 
          fill="#FFFFFF" 
          stroke="#C20023" 
          stroke-width="5" 
          stroke-linejoin="round"
          paint-order="stroke fill"
          text-anchor="middle" 
          letter-spacing="12">
      HIRED!
    </text>
  </g>

  <!-- 4. Corner Specular Sheen -->
  <path d="M 0 0 L 290 0 L 145 512 L 0 512 Z" fill="#FFFFFF" fill-opacity="0.04" />
</svg>
