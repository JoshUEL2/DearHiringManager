<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Deep Slate Background -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#24304A" />
      <stop offset="60%" stop-color="#141926" />
      <stop offset="100%" stop-color="#0B0E17" />
    </radialGradient>

    <!-- Crisp Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8ECF5" />
    </linearGradient>

    <!-- Bold Crimson Stamp Gradient -->
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="100%" stop-color="#C90025" />
    </linearGradient>

    <!-- Heavy Drop Shadow for Mobile Scale Readability -->
    <filter id="mobileCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Stamp High-Contrast Drop Shadow -->
    <filter id="mobileStampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. App Icon Squircle Base (512x512) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#41537A" stroke-width="3" stroke-opacity="0.4" />

  <!-- 2. The Job Application Document (Enlarged and Centered for Mobile) -->
  <g transform="translate(96, 52)" filter="url(#mobileCardShadow)">
    <!-- Base Paper Page (320px wide x 395px tall) -->
    <path d="M 0 20 C 0 8.95 8.95 0 20 0 L 225 0 L 320 95 L 320 375 C 320 386.05 311.05 395 300 395 L 20 395 C 8.95 395 0 386.05 0 375 Z" fill="url(#paperGrad)" />

    <!-- Crisp Folded Corner -->
    <path d="M 225 0 L 320 95 L 245 95 C 233.95 95 225 86.05 225 75 Z" fill="#C5CCE0" />
    <path d="M 225 0 L 225 75 C 225 86.05 233.95 95 245 95 L 320 95" fill="none" stroke="#9EA9C4" stroke-width="3" />

    <!-- High-Contrast Profile Avatar / Badge -->
    <rect x="34" y="38" width="58" height="58" rx="16" fill="#3B4866" />
    <circle cx="63" cy="58" r="14" fill="#FFFFFF" />
    <path d="M 46 86 C 46 75 54 73 63 73 C 72 73 80 75 80 86 Z" fill="#FFFFFF" />

    <!-- Bold Application Header Lines -->
    <rect x="108" y="46" width="105" height="18" rx="9" fill="#1C2438" />
    <rect x="108" y="72" width="70" height="12" rx="6" fill="#6B7894" />

    <!-- Bold Body Content Lines (Thickened for tiny screen thumbnail viewing) -->
    <rect x="34" y="120" width="252" height="16" rx="8" fill="#BAC3D6" />
    <rect x="34" y="150" width="220" height="16" rx="8" fill="#BAC3D6" />
    <rect x="34" y="180" width="240" height="16" rx="8" fill="#BAC3D6" />
    <rect x="34" y="210" width="180" height="16" rx="8" fill="#BAC3D6" />

    <!-- 5 Star Candidate Rating (High contrast Gold) -->
    <g transform="translate(34, 246)">
      <polygon points="14,2 18,10 27,10 20,16 23,24 14,19 6,24 8,16 2,10 11,10" fill="#FFB703" />
      <polygon points="44,2 48,10 57,10 50,16 53,24 44,19 36,24 38,16 32,10 41,10" fill="#FFB703" />
      <polygon points="74,2 78,10 87,10 80,16 83,24 74,19 66,24 68,16 62,10 71,10" fill="#FFB703" />
      <polygon points="104,2 108,10 117,10 110,16 113,24 104,19 96,24 98,16 92,10 101,10" fill="#FFB703" />
      <polygon points="134,2 138,10 147,10 140,16 143,24 134,19 126,24 128,16 122,10 131,10" fill="#CBD3E2" />
    </g>

    <!-- Applicant Signature Line -->
    <path d="M 34 325 Q 65 295 95 325 T 160 320" fill="none" stroke="#2B3448" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 3. MOBILE-OPTIMIZED RUBBER STAMP: "HIRED!" -->
  <!-- Enlarged by 150%, solid opaque crimson background, stark white bold lettering -->
  <g transform="translate(256, 360) rotate(-13)" filter="url(#mobileStampShadow)">
    <!-- Heavy Solid Stamp Background Plate (Blocks out background so text never clashes) -->
    <rect x="-170" y="-62" width="340" height="124" rx="20" fill="url(#stampGrad)" stroke="#FFFFFF" stroke-width="6" />

    <!-- Distressed / Textured Inner Border -->
    <rect x="-158" y="-50" width="316" height="100" rx="14" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="290, 8, 8, 8" stroke-opacity="0.9" />

    <!-- ULTRA-BOLD TEXT: Clearly readable at 64px, 48px, and phone home screen sizes -->
    <text x="0" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      HIRED!
    </text>
  </g>

  <!-- 4. Subtle Top-Left Glass Sheen -->
  <path d="M 0 0 L 280 0 L 140 512 L 0 512 Z" fill="#FFFFFF" fill-opacity="0.04" />
</svg>
