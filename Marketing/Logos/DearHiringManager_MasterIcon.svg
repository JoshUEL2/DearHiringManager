<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#1c2438" />
      <stop offset="100%" stop-color="#0b0e17" />
    </linearGradient>

    <!-- Document Gold/Warm Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F3F7" />
    </linearGradient>

    <!-- Accent Stamp Gradient -->
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="stampShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#D90429" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. Background Container (App Icon Squircle / Safe Box) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Rim Light Inner Glow -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#3A4A6E" stroke-width="3" stroke-opacity="0.4" />

  <!-- 2. The Application Dossier / Cover Letter -->
  <g transform="translate(106, 75)" filter="url(#cardShadow)">
    <!-- Base Paper -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 210 0 L 300 90 L 300 344 C 300 352.84 292.84 360 284 360 L 16 360 C 7.16 360 0 352.84 0 344 Z" fill="url(#docGrad)" />
    
    <!-- Folded Corner -->
    <path d="M 210 0 L 300 90 L 226 90 C 217.16 90 210 82.84 210 74 Z" fill="#D3D7E3" />
    <path d="M 210 0 L 210 74 C 210 82.84 217.16 90 226 90 L 300 90" fill="none" stroke="#B0B7C9" stroke-width="2" />

    <!-- Document Header / Avatar Mockup -->
    <rect x="36" y="44" width="48" height="48" rx="12" fill="#E2E6F0" />
    <circle cx="60" cy="62" r="12" fill="#9BA3BA" />
    <path d="M 46 86 C 46 76 52 74 60 74 C 68 74 74 76 74 86 Z" fill="#9BA3BA" />

    <!-- Text Lines (Simulating Resume / Letter) -->
    <rect x="100" y="52" width="90" height="12" rx="6" fill="#1C2438" />
    <rect x="100" y="74" width="60" height="8" rx="4" fill="#7C88A2" />

    <!-- Body Lines -->
    <rect x="36" y="122" width="228" height="10" rx="5" fill="#CAD0DF" />
    <rect x="36" y="148" width="200" height="10" rx="5" fill="#CAD0DF" />
    <rect x="36" y="174" width="215" height="10" rx="5" fill="#CAD0DF" />
    <rect x="36" y="200" width="160" height="10" rx="5" fill="#CAD0DF" />

    <!-- Subtle Gold Star Rating / Skill Metric -->
    <g transform="translate(36, 230)">
      <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" fill="#FBBF24" />
      <polygon points="36,2 39,9 46,9 41,14 43,21 36,17 29,21 31,14 26,9 33,9" fill="#FBBF24" />
      <polygon points="60,2 63,9 70,9 65,14 67,21 60,17 53,21 55,14 50,9 57,9" fill="#FBBF24" />
      <polygon points="84,2 87,9 94,9 89,14 91,21 84,17 77,21 79,14 74,9 81,9" fill="#CAD0DF" />
      <polygon points="108,2 111,9 118,9 113,14 115,21 108,17 101,21 103,14 98,9 105,9" fill="#CAD0DF" />
    </g>

    <!-- Sign-off line -->
    <path d="M 36 295 Q 60 270 85 295 T 130 290" fill="none" stroke="#4B5563" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 3. Dynamic "HIRED!" or "REJECTED?" Rubber Stamp Angle -->
  <g transform="translate(185, 270) rotate(-14)" filter="url(#stampShadow)">
    <!-- Stamp Outline Border -->
    <rect x="0" y="0" width="220" height="88" rx="14" fill="none" stroke="url(#stampGrad)" stroke-width="7" stroke-dasharray="190, 8, 8, 8" />
    <rect x="6" y="6" width="208" height="76" rx="10" fill="#D90429" fill-opacity="0.12" />
    
    <!-- Stamp Text -->
    <text x="110" y="58" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="url(#stampGrad)" text-anchor="middle" letter-spacing="3">
      HIRED?
    </text>
  </g>

  <!-- 4. Subtle Foreground Glass / Polished Edge -->
  <path d="M 0 0 L 260 0 L 120 512 L 0 512 Z" fill="#FFFFFF" fill-opacity="0.03" />
</svg>
