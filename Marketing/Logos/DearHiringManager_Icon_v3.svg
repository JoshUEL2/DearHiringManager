<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#222C42" />
      <stop offset="65%" stop-color="#121622" />
      <stop offset="100%" stop-color="#080A0F" />
    </radialGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5EAF2" />
    </linearGradient>

    <!-- Ultra-Vibrant Stamp Gradient -->
    <linearGradient id="stampGradV3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A48" />
      <stop offset="100%" stop-color="#D00028" />
    </linearGradient>

    <!-- Heavy Drop Shadow for Document -->
    <filter id="docShadowV3" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Stamp High-Contrast 3D Drop Shadow -->
    <filter id="stampShadowV3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- 1. App Icon Squircle Base (512x512) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#3D4B6E" stroke-width="3" stroke-opacity="0.5" />

  <!-- 2. The Application Document -->
  <g transform="translate(92, 42)" filter="url(#docShadowV3)">
    <!-- Base Paper (328px wide x 410px tall) -->
    <path d="M 0 22 C 0 9.85 9.85 0 22 0 L 230 0 L 328 98 L 328 388 C 328 400.15 318.15 410 306 410 L 22 410 C 9.85 410 0 400.15 0 388 Z" fill="url(#paperGrad)" />

    <!-- Folded Corner -->
    <path d="M 230 0 L 328 98 L 250 98 C 238.95 98 230 89.05 230 78 Z" fill="#BDC6DC" />
    <path d="M 230 0 L 230 78 C 230 89.05 238.95 98 250 98 L 328 98" fill="none" stroke="#96A2C2" stroke-width="3" />

    <!-- Candidate Photo / ID Silhouette -->
    <rect x="36" y="38" width="64" height="64" rx="16" fill="#303A52" />
    <circle cx="68" cy="60" r="16" fill="#FFFFFF" />
    <path d="M 48 92 C 48 78 57 76 68 76 C 79 76 88 78 88 92 Z" fill="#FFFFFF" />

    <!-- Application Header / Subject Title -->
    <rect x="116" y="46" width="115" height="20" rx="10" fill="#182032" />
    <rect x="116" y="74" width="75" height="14" rx="7" fill="#66738F" />

    <!-- Thick Content Lines -->
    <rect x="36" y="126" width="256" height="18" rx="9" fill="#B4BED2" />
    <rect x="36" y="158" width="224" height="18" rx="9" fill="#B4BED2" />
    <rect x="36" y="190" width="244" height="18" rx="9" fill="#B4BED2" />

    <!-- 5 Star Candidate Rating -->
    <g transform="translate(36, 230)">
      <polygon points="15,2 19,11 29,11 21,17 24,26 15,20 6,26 9,17 1,11 11,11" fill="#FFB703" />
      <polygon points="47,2 51,11 61,11 53,17 56,26 47,20 38,26 41,17 33,11 43,11" fill="#FFB703" />
      <polygon points="79,2 83,11 93,11 85,17 88,26 79,20 70,26 73,17 65,11 75,11" fill="#FFB703" />
      <polygon points="111,2 115,11 125,11 117,17 120,26 111,20 102,26 105,17 97,11 107,11" fill="#FFB703" />
      <polygon points="143,2 147,11 157,11 149,17 152,26 143,20 134,26 137,17 129,11 139,11" fill="#C5CEE0" />
    </g>
  </g>

  <!-- 3. V3 STAMP: MASSIVE 100PX FONT + EXTRA-THICK CONTRAST OUTLINES -->
  <!-- Angled -10deg across the bottom half -->
  <g transform="translate(256, 368) rotate(-10)" filter="url(#stampShadowV3)">
    <!-- Heavy Solid Stamp Badge (Wider 430px x 136px) -->
    <rect x="-215" y="-68" width="430" height="136" rx="24" fill="url(#stampGradV3)" stroke="#FFFFFF" stroke-width="9" />

    <!-- Distressed Stamp Dash Inner Frame -->
    <rect x="-202" y="-55" width="404" height="110" rx="16" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-dasharray="370, 10, 10, 10" stroke-opacity="0.95" />

    <!-- Black Drop/Under-Glow for Text Shadow Depth -->
    <text x="0" y="36" font-family="'Impact', 'Arial Black', sans-serif" font-size="104" font-weight="900" fill="#7A0014" text-anchor="middle" letter-spacing="6">
      HIRED!
    </text>

    <!-- Ultra-Bold Crisp White Main Lettering -->
    <text x="0" y="32" font-family="'Impact', 'Arial Black', sans-serif" font-size="104" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
      HIRED!
    </text>
  </g>

  <!-- 4. Corner Specular Sheen -->
  <path d="M 0 0 L 290 0 L 145 512 L 0 512 Z" fill="#FFFFFF" fill-opacity="0.04" />
</svg>
